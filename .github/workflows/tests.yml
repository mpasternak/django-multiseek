name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.1", "5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Pin Django version
        run: uv pip install "Django~=${{ matrix.django-version }}.0"

      # pytest-django 4.13 dropped Django < 5.2: its _django_db_helper fixture
      # reads TestCase._pre_setup_ran_eagerly, an attribute that only exists
      # from Django 5.2 on. Without this pin every DB test errors out on the
      # legacy matrix cells. pytest-django declares no Django dependency, so
      # downgrading it cannot disturb the Django version pinned above.
      - name: Pin pytest-django for legacy Django
        if: matrix.django-version == '4.2' || matrix.django-version == '5.1'
        run: uv pip install "pytest-django<4.13"

      - name: Install JS deps and collect static
        working-directory: test_project
        run: |
          yarn
          uv run --no-sync python manage.py collectstatic --noinput -v0

      - name: Run tests
        run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .
