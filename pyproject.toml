[build-system]
requires = ["setuptools>=75.0", "Django>=4.2"]
build-backend = "setuptools.build_meta"

[project]
name = "django-multiseek"
version = "0.10.2"
description = "Build a form to seek records using multiple parameters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michal Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["django", "multiseek"]
dependencies = [
    "Django>=4.2",
    "python-dateutil>=2.8.1",
    "django-autocomplete-light>=3.8.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
Homepage = "https://github.com/mpasternak/django-multiseek"

[project.optional-dependencies]
dev = [
    "bumpver",
    "pytest-django",
    "pytest-xdist",
    "pytest-playwright",
    "pytest-cov",
    "model_bakery",
    "psycopg2-binary",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["multiseek*"]

[tool.setuptools.package-data]
multiseek = [
    "locale/*/LC_MESSAGES/*",
    # Recursive globs: static assets live in subdirs (js/, css/), which a
    # single-`*` glob does NOT match under modern setuptools. `**/*` ships
    # every asset regardless of how the tree is organised.
    "static/**/*",
    "templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["test_project", "multiseek"]
pythonpath = ["test_project"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--ds=test_project.settings",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Test aggregator deliberately re-exports everything from sibling modules
# so the suite can be discovered as a single package.
"multiseek/tests/__init__.py" = ["F401", "F403"]

[tool.bumpver]
current_version = "0.10.2"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
