[build-system]
requires = ["setuptools>=75.0", "Django>=4.2"]
build-backend = "setuptools.build_meta"

[project]
name = "django-multiseek"
version = "0.9.47"
description = "Build a form to seek records using multiple parameters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michal Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["django", "multiseek"]
dependencies = [
    "Django>=4.2",
    "python-dateutil>=2.8.1",
    "django-autocomplete-light>=3.8.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mpasternak/django-multiseek"

[project.optional-dependencies]
dev = [
    "pytest-django",
    "pytest-xdist",
    "pytest-splinter",
    "pytest-cov",
    "coveralls",
    "mock",
    "model_bakery",
    "psycopg2-binary",
]

[tool.setuptools.packages.find]
include = ["multiseek*"]

[tool.setuptools.package-data]
multiseek = [
    "locale/*/LC_MESSAGES/*",
    "static/multiseek/*.js",
    "static/multiseek/*.css",
    "templates/multiseek/*.html",
]
